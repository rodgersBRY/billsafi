<style>
#il{--teal:#0f766e;--bg:light-dark(#f5f8f7,#142421);--panel:light-dark(#fff,#1d302c);--ink:light-dark(#172b2a,#edf5f1);--sub:light-dark(#627570,#adc0b8);--line:light-dark(#e0e9e4,#354c44);--soft:light-dark(#e8f3ef,#24483e);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:180px 1fr;min-height:630px}#il *{box-sizing:border-box}#il button,#il input,#il select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px}#il button{cursor:pointer}#il .primary{background:var(--teal);color:white;border-color:var(--teal)}#il aside{background:var(--panel);padding:25px 17px;border-right:1px solid var(--line)}#il .brand{font-size:23px;font-weight:650;letter-spacing:-.8px;color:var(--teal);margin-bottom:24px}#il aside select{width:100%}#il nav{display:grid;gap:8px;margin-top:23px}#il nav span{padding:10px;color:var(--sub);border-radius:6px}#il nav .active{background:var(--soft);color:var(--teal)}#il main{min-width:0}#il header{padding:19px 100px 19px 25px;background:var(--panel);border-bottom:1px solid var(--line)}#il .content{padding:26px}#il h1{font-size:27px;letter-spacing:-.7px;font-weight:600;margin:0}#il h2{font-size:18px;font-weight:600;margin:0}#il p{margin:5px 0 0;color:var(--sub)}#il .small{font-size:12px;color:var(--sub)}#il .heading{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:23px}#il .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}#il .tools input{flex:1;min-width:160px}#il .list{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}#il .row{display:grid;grid-template-columns:minmax(120px,1.25fr) 95px 100px minmax(90px,.8fr) 45px;gap:12px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--line)}#il .row:last-child{border:0}#il .row.head{background:var(--bg);font-size:12px;color:var(--sub);padding-top:12px;padding-bottom:12px}#il .money{font-variant-numeric:tabular-nums;text-align:right}#il .pill{font-size:11px;padding:4px 7px;display:inline-block;border-radius:5px;background:var(--soft);color:var(--teal)}#il .warn{background:light-dark(#fff1dc,#493822);color:light-dark(#81520c,#efc77d)}#il .neutral{background:var(--bg);color:var(--sub)}#il .late{font-size:11px;color:light-dark(#b04737,#f2a89b);margin-top:3px}#il .open{border:0;padding:5px;color:var(--teal);font-size:12px}#il .detail{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:23px}#il .detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center}#il .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#il .amount{font-size:20px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}#il .actions{display:flex;gap:8px;flex-wrap:wrap}#il .notice{padding:15px;background:var(--bg);border-radius:6px;color:var(--sub);font-size:12px;margin-top:18px}#il .payment{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}#il label{font-size:12px;color:var(--sub);display:block}#il label input,#il label select{display:block;width:100%;margin-top:6px}#il .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:14px 0}#il .footer{margin-top:20px;font-size:12px;color:var(--sub)}#il .message{margin-top:14px;font-size:12px;color:var(--teal)}#il [hidden]{display:none!important}@media(max-width:790px){#il{grid-template-columns:1fr}#il aside{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 20px;border-right:0;border-bottom:1px solid var(--line)}#il .brand{margin:0}#il aside select{width:auto;max-width:185px}#il nav{display:flex;flex-wrap:wrap;margin:0}#il nav span{padding:6px}#il .row{grid-template-columns:minmax(110px,1fr) 90px 90px 40px}#il .due{display:none}}@media(max-width:480px){#il .content{padding:18px 12px}#il .row{grid-template-columns:1fr 90px 35px;gap:7px;padding:15px 11px}#il .status{grid-column:1;grid-row:auto}#il .row.head{display:none}#il .row>.money{grid-column:2;grid-row:1}#il .row>.open{grid-column:3;grid-row:1}#il .row{position:relative}#il .summary{grid-template-columns:1fr;gap:12px}#il .summary>div{display:flex;justify-content:space-between;align-items:center}#il .amount{margin:0;font-size:17px}#il .fields{grid-template-columns:1fr}#il input,#il select{font-size:16px}#il .detail{padding:17px}}
</style>
<div id="il" aria-label="TallyNest invoice management concept"><aside><div class="brand">TallyNest</div><select id="il-business" aria-label="Selected business"><option>Mawira Studio</option><option>Mawira Consulting</option></select><nav aria-label="Navigation preview"><span>Overview</span><span class="active">Invoices</span><span>Clients</span><span>Settings</span></nav></aside><main><header>Invoices <span class="small">/ Selected business</span></header><div class="content"><div class="heading"><div><h1>Every invoice, in view.</h1><p>Find the details. Keep payments moving.</p></div><button class="primary" type="button" id="il-create">＋ Create invoice</button></div><div class="tools"><input id="il-search" type="search" aria-label="Search invoices" placeholder="Search invoice or client"><select id="il-filter" aria-label="Filter invoices"><option>All invoices</option><option>Draft</option><option>Ready</option><option>Partially paid</option><option>Paid</option><option>Cancelled</option><option>Overdue</option></select></div><section class="list" id="il-list" aria-label="Invoice list"></section><section class="detail" id="il-detail" hidden><div class="detail-head"><div><h2 id="il-title"></h2><p id="il-client"></p></div><button type="button" id="il-close" aria-label="Close invoice details">×</button></div><div class="summary"><div><div class="small">Invoice total · KES</div><div class="amount" id="il-total"></div></div><div><div class="small">Payments received · KES</div><div class="amount" id="il-paid"></div></div><div><div class="small">Balance due · KES</div><div class="amount" id="il-balance"></div></div></div><div class="actions"><button class="primary" type="button" id="il-record">Record payment</button><button type="button" id="il-view">View invoice</button><button type="button" id="il-share">Share</button><button type="button" id="il-edit">Edit</button></div><div class="notice" id="il-note"></div><div class="payment" id="il-payment" hidden><h2>Record payment</h2><div class="fields"><label>Amount received (KES)<input id="il-payamount" type="number" min="0"></label><label>Payment date<input type="date" id="il-paydate" value="2026-10-15"></label><label>Method<select id="il-method"><option>M-Pesa</option><option>Bank transfer</option><option>Other</option></select></label><label>Reference · Optional<input id="il-ref" placeholder="Transaction reference"></label></div><div class="actions"><button class="primary" type="button" id="il-savepayment">Save payment</button><button type="button" id="il-cancelpayment">Cancel</button></div></div></section><div class="message" id="il-message" aria-live="polite"></div><div class="footer">Design preview · sample invoices · payments stay in this preview</div></div></main></div>
<script>
(()=>{const r=document.getElementById('il');const q=id=>r.querySelector('#'+id);const rows=[{id:1,b:0,n:'INV-0032',client:'Acacia Creative',due:'28 Oct 2026',total:40000,paid:0,status:'Ready'},{id:2,b:0,n:'INV-0031',client:'Kijani Collective',due:'20 Oct 2026',total:45000,paid:25000,status:'Partially paid'},{id:3,b:0,n:'INV-0030',client:'Nuru Media',due:'10 Oct 2026',total:30000,paid:5000,status:'Partially paid',late:true},{id:4,b:0,n:'INV-0029',client:'Soko Studio',due:'05 Oct 2026',total:35000,paid:35000,status:'Paid'},{id:5,b:0,n:'Draft',client:'Acacia Creative',due:'30 Oct 2026',total:12000,paid:0,status:'Draft'},{id:6,b:0,n:'INV-0028',client:'Nuru Media',due:'01 Oct 2026',total:8000,paid:0,status:'Cancelled'},{id:7,b:1,n:'INV-0018',client:'Ridge Partners',due:'30 Oct 2026',total:15000,paid:0,status:'Ready'}];let selected=null;const money=n=>n.toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});function render(){const term=q('il-search').value.toLowerCase(),filter=q('il-filter').value;const list=rows.filter(x=>x.b===q('il-business').selectedIndex&&(x.n+' '+x.client).toLowerCase().includes(term)&&(filter==='All invoices'||filter==='Overdue'&&x.late||filter===x.status));q('il-list').innerHTML='<div class="row head"><span>Invoice / client</span><span class="due">Due date</span><span class="money">Balance · KES</span><span>Status</span><span></span></div>'+list.map(x=>'<div class="row"><div>'+x.n+'<div class="small">'+x.client+'</div></div><div class="due small">'+x.due+'</div><div class="money">'+money(x.total-x.paid)+'</div><div class="status"><span class="pill '+(x.status==='Partially paid'?'warn':['Draft','Cancelled','Ready'].includes(x.status)?'neutral':'')+'">'+x.status+'</span>'+(x.late?'<div class="late">Overdue</div>':'')+'</div><button type="button" class="open" data-id="'+x.id+'" aria-label="Open '+x.n+' for '+x.client+'">Open</button></div>').join('')+(list.length?'':'<div style="padding:20px" class="small">No matching invoices.</div>');r.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(+b.dataset.id));}function open(id){selected=rows.find(x=>x.id===id);q('il-detail').hidden=false;q('il-payment').hidden=true;q('il-title').textContent=selected.n+' · '+selected.status;q('il-client').textContent=selected.client;q('il-total').textContent=money(selected.total);q('il-paid').textContent=money(selected.paid);q('il-balance').textContent=money(selected.total-selected.paid);q('il-record').hidden=!['Ready','Partially paid'].includes(selected.status);q('il-share').hidden=q('il-view').hidden=['Draft','Cancelled'].includes(selected.status);q('il-note').textContent=selected.paid?'Payments have been recorded. Client, line items, discount, and tax are locked; notes remain editable.':selected.status==='Cancelled'?'This invoice is cancelled and retained for your records.':'No payments recorded.';q('il-edit').hidden=selected.status==='Cancelled';q('il-message').textContent='';}q('il-record').onclick=()=>{q('il-payment').hidden=false;q('il-payamount').value='';};q('il-savepayment').onclick=()=>{const amount=+q('il-payamount').value;const balance=selected.total-selected.paid;if(!(amount>0)||amount>balance||!q('il-paydate').value){q('il-message').textContent='Enter a positive amount within the outstanding balance and a payment date.';return;}selected.paid+=amount;selected.status=selected.paid===selected.total?'Paid':'Partially paid';if(selected.status==='Paid')selected.late=false;render();open(selected.id);q('il-message').textContent='Sample payment recorded; balance and status updated.';};q('il-cancelpayment').onclick=()=>q('il-payment').hidden=true;q('il-close').onclick=()=>q('il-detail').hidden=true;q('il-create').onclick=()=>q('il-message').textContent='In the finished app, this opens the approved invoice editor.';q('il-edit').onclick=()=>q('il-message').textContent=selected.paid?'Preview: open the editor with financial fields locked and notes editable.':'Preview: open the invoice editor.';q('il-view').onclick=()=>q('il-message').textContent='Preview: open the approved client-facing invoice page.';q('il-share').onclick=()=>q('il-message').textContent='Preview: share by public link, WhatsApp, email draft, or PDF.';q('il-search').oninput=render;q('il-filter').onchange=render;q('il-business').onchange=()=>{q('il-detail').hidden=true;q('il-message').textContent='';render();};render();})();
</script>
