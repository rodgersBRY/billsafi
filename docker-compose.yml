services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tallynest
      POSTGRES_PASSWORD: tallynest
      POSTGRES_DB: tallynest
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallynest -d tallynest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
