services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tallynest
      POSTGRES_PASSWORD: tallynest
      POSTGRES_DB: tallynest
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallynest -d tallynest"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outgoing email locally. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
