name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tallynest
          POSTGRES_PASSWORD: tallynest
          POSTGRES_DB: tallynest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallynest -d tallynest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tallynest:tallynest@localhost:5432/tallynest
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      # End-to-end tests replace the mailer; this only satisfies config validation.
      SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run build typecheck lint test
      - run: pnpm db:migrate
      - run: pnpm test:e2e
