name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: billsafi
          POSTGRES_PASSWORD: billsafi
          POSTGRES_DB: billsafi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billsafi -d billsafi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.29
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://billsafi:billsafi@localhost:5432/billsafi
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      # API tests capture mail in memory; browser tests read it from Mailpit.
      SMTP_URL: smtp://localhost:1025
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      # Shows "Continue with Google"; browser tests stop the redirect before Google.
      GOOGLE_CLIENT_ID: ci-only.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-google-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run build typecheck lint test
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      # A fixed-ID admin for the admin browser tests. Listed only for the browser step, so the
      # API Playwright starts promotes it at start-up and the API e2e run above is unaffected.
      - run: pnpm --filter @billsafi/api seed:browser-admin
        env:
          E2E_ADMIN_EMAIL: admin-e2e@example.test
          E2E_ADMIN_PASSWORD: ci-only-admin-password
      # Uses the runner's installed Chrome; Playwright starts the built API and web app.
      - run: pnpm --filter @billsafi/web test:browser
        env:
          ADMIN_USER_IDS: 00000000-0000-4000-8000-0000000000ad
          E2E_ADMIN_EMAIL: admin-e2e@example.test
          E2E_ADMIN_PASSWORD: ci-only-admin-password
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
