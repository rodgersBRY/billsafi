name: Publish images

# Pushes the api, migrate and web images to GHCR after CI passes on main.
# Each image is tagged with the commit SHA and `latest`. Deploying is a manual
# step on the droplet (deploy/README.md). Run by hand to rebuild an earlier commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to build (defaults to the selected branch head). Does not move `latest`.
        required: false

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: meta
        env:
          SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          # Only the newest main commit moves `latest`; a manual rebuild of an old SHA must not.
          MOVE_LATEST: ${{ github.event_name == 'workflow_run' || inputs.sha == '' }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tallynest"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          for name in api migrate web; do
            tags="${prefix}-${name}:${SHA}"
            if [ "$MOVE_LATEST" = "true" ]; then tags="${tags},${prefix}-${name}:latest"; fi
            echo "${name}=${tags}" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.api }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: ${{ steps.meta.outputs.migrate }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Repository variable; the browser DSN is public by design.
          build-args: NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_WEB_DSN }}
          tags: ${{ steps.meta.outputs.web }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Summary
        run: |
          {
            echo "Published \`${{ steps.meta.outputs.sha }}\` to \`${{ steps.meta.outputs.prefix }}-{api,migrate,web}\`."
            echo
            echo "Deploy on the droplet: \`cd /opt/tallynest && ./deploy.sh\` (or \`./deploy.sh ${{ steps.meta.outputs.sha }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
